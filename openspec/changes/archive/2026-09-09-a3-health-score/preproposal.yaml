confirmed_decisions:
  - A3.asof opcion a: mismo k = 2 para bajas y activas; lectura literal reportada como sensibilidad (ADR-005)
  - A3.signals opcion a: momentum, cambio mes a mes, caida y antiguedad en el score; soporte, activacion, canal y segmento medidos con peso cero (ADR-005)
  - A3.weights opcion a: 0.35 / 0.20 / 0.15 / 0.30 por juicio, verificados por el harness (AUC >= 0.95 y recall >= 0.85 al 20 %), con la mezcla medida como respaldo (ADR-005)
  - A3.threshold opcion a: top-N por capacidad al 15 % (81 cuentas, 12 por CSM) con 10 y 20 % de sensibilidad y un corte fijo de referencia (ADR-005)
  - A3.context opcion a: banda sin historia contada en el denominador del recall; canal y segmento fuera del score como factores aparte (ADR-005)
  - research: no seleccionada
  - decision del usuario el 2026-09-08: "Todo lo recomendado, sigue a la propuesta"
assumptions_stated:
  - el entregable espeja el patron analyze (comando health, outputs/health con health_scores.csv, validation.md y goldens)
  - las senales de soporte usan conteos y CSAT, nunca tiempo de resolucion (ADR-004), y respetan el mes de corte con una vista ventanada nueva
  - las cuentas sin historia suficiente nunca se reportan como sanas por default (ADR-003)
