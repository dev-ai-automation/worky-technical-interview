confirmed_decisions:
  - A4.shape opcion b: documento de diseno + ERD + DDL ejecutable acotado; comando `warehouse` que materializa el esquema en estrella sobre DuckDB envolviendo los marts existentes sin modificarlos (ADR-006)
  - A4.persist opcion a: el .duckdb del comando warehouse se persiste entre corridas; build, analyze y health siguen regenerando el suyo (excepcion documentada a la decision D6 de A0)
  - A4.overrides opcion a: tabla identity_overrides agregada en A4 como extension aditiva sobre identity_resolution, sin modificar archivos existentes de ese modulo
  - A4.watermark opcion a: la marca de agua incremental por sistema origen se documenta con su contrato exacto y solo se implementa si sobra presupuesto tras dim_company/SCD2/overrides
  - A4.health_history opcion a: fact_health_score_monthly entra en A4 con el mismo mecanismo de snapshot por fecha de corrida que dim_company
  - A4.overrides_in_build (ajuste del 2026-09-09, "Si, build tambien"): resolve y build aplican identity_overrides despues de la cascada via un archivo nuevo en identity_resolution y una llamada desde cli.py; identity-resolution pasa a capacidad modificada con un requisito AGREGADO; sin archivo de overrides la salida es identica byte a byte
  - research: no seleccionada
  - decision del usuario el 2026-09-09: "Vamos con las recomendaciones"
assumptions_stated:
  - los marts y el modulo identity_resolution de A0 no se modifican; A4 los envuelve y agrega tablas nuevas
  - ninguna fuente trae historial de plan, CSM o MRR; el SCD2 se captura hacia adelante y se demuestra con una prueba de dos corridas
  - fact_revenue_monthly se construye agregando deals por fecha de cierre, no como serie de mrr_mxn
  - la capa Data Vault ligera queda como trabajo futuro documentado, sin codigo
  - las llaves surrogate se generan de forma determinista para conservar la idempotencia byte a byte
