      function syncThemeLabel() {
        var theme = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        themeLabel.textContent = theme === 'light' ? 'Light' : 'Dark';
      }
      syncThemeLabel();
      themeBtn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('archify-mermaid-theme', next); } catch (_) {}
        syncThemeLabel();
      });

      function currentSvg() {
        return document.querySelector('#mm-diagram-container svg');
      }

      function setStatus(message, state) {
        if (!statusEl) return;
        if (!message) { statusEl.hidden = true; statusEl.textContent = ''; statusEl.removeAttribute('data-state'); return; }
        statusEl.hidden = false;
        statusEl.textContent = message;
        if (state) statusEl.setAttribute('data-state', state); else statusEl.removeAttribute('data-state');
      }

      function serializedSvg() {
        var svg = currentSvg();
        if (!svg) return null;
        var clone = svg.cloneNode(true);
        if (!clone.getAttribute('xmlns')) clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        return new XMLSerializer().serializeToString(clone);
      }

      function download(blob, filename) {
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      }

      exportSvgBtn.addEventListener('click', function () {
        var svgString = serializedSvg();
        if (!svgString) { setStatus('No SVG is available to export yet.', 'error'); return; }
        download(new Blob([svgString], { type: 'image/svg+xml' }), 'state.svg');
      });

      exportPngBtn.addEventListener('click', function () {
        var svg = currentSvg();
        var svgString = serializedSvg();
        if (!svg || !svgString) { setStatus('No SVG is available to export yet.', 'error'); return; }
        var viewBox = (svg.getAttribute('viewBox') || '').split(/\s+/).map(Number);
        var width = viewBox.length === 4 && viewBox[2] > 0 ? viewBox[2] : (svg.width && svg.width.baseVal.value) || 1000;
        var height = viewBox.length === 4 && viewBox[3] > 0 ? viewBox[3] : (svg.height && svg.height.baseVal.value) || 700;
        var scale = 2;
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(width * scale));
        canvas.height = Math.max(1, Math.round(height * scale));
        var ctx = canvas.getContext('2d');
        var img = new Image();
        var svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        var url = URL.createObjectURL(svgBlob);
        img.onload = function () {
          ctx.fillStyle = getComputedStyle(root).getPropertyValue('--svg-bg') || '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          if (typeof canvas.toBlob !== 'function') { setStatus('This browser cannot export PNG from canvas.', 'error'); return; }
          canvas.toBlob(function (blob) {
            if (!blob) { setStatus('PNG export failed.', 'error'); return; }
            download(blob, 'state.png');
          }, 'image/png');
        };
        img.onerror = function () {
          URL.revokeObjectURL(url);
          setStatus('PNG export failed while rasterizing the SVG.', 'error');
        };
        img.src = url;
      });

      window.__archifyMermaidSetStatus = setStatus;
    })();
  </script>
</body>
</html>
